# Netlify: Add new site -> Import from GitHub -> this repo. Settings below are picked up automatically.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to Render so the browser sees one origin.
# The auth cookie then stays first-party and SameSite=Strict keeps working.
# >>> Replace the host with your Render URL <<<
[[redirects]]
  from = "/api/*"
  to = "https://techfest-api.onrender.com/api/:splat"
  status = 200
  force = true

# React Router: serve index.html for every page so refreshing /events or /dashboard works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite puts a content hash in every asset filename, so they can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
