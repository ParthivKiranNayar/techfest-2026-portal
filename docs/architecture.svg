<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b4b">TechFest 2026 Portal: deployment architecture</text>

  <!-- request path -->
  <g font-size="14" fill="#1c1b29">
    <rect x="20" y="80" width="160" height="110" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="100" y="118" text-anchor="middle" font-weight="700">Browser</text>
    <text x="100" y="140" text-anchor="middle">Phone / laptop</text>
    <text x="100" y="160" text-anchor="middle">Chrome, Edge, Firefox</text>

    <rect x="250" y="70" width="200" height="130" rx="12" fill="#ecfdf5" stroke="#059669"/>
    <text x="350" y="100" text-anchor="middle" font-weight="700">Netlify (frontend)</text>
    <text x="350" y="122" text-anchor="middle">React build from Vite</text>
    <text x="350" y="142" text-anchor="middle">CSP + cache headers</text>
    <text x="350" y="162" text-anchor="middle">SPA redirect /* → index.html</text>
    <text x="350" y="182" text-anchor="middle">Proxy /api/* → Render</text>

    <rect x="520" y="70" width="200" height="130" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="620" y="100" text-anchor="middle" font-weight="700">Render (backend)</text>
    <text x="620" y="122" text-anchor="middle">Node 22 + Express 4</text>
    <text x="620" y="142" text-anchor="middle">Helmet, sanitize, validator</text>
    <text x="620" y="162" text-anchor="middle">JWT in httpOnly cookie</text>
    <text x="620" y="182" text-anchor="middle">GET /api/health</text>

    <rect x="790" y="70" width="150" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="865" y="100" text-anchor="middle" font-weight="700">MongoDB Atlas</text>
    <text x="865" y="122" text-anchor="middle">M0 free cluster</text>
    <text x="865" y="142" text-anchor="middle">users, events,</text>
    <text x="865" y="162" text-anchor="middle">feedbacks</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="180" y1="135" x2="246" y2="135"/>
    <line x1="450" y1="135" x2="516" y2="135"/>
    <line x1="720" y1="135" x2="786" y2="135"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="213" y="125">HTTPS</text>
    <text x="483" y="125">HTTPS</text>
    <text x="753" y="125">TLS (SRV)</text>
  </g>

  <!-- CI/CD path -->
  <g font-size="14" fill="#1c1b29">
    <rect x="20" y="300" width="160" height="90" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="100" y="338" text-anchor="middle" font-weight="700">Developer</text>
    <text x="100" y="360" text-anchor="middle">git push (branches)</text>

    <rect x="250" y="300" width="200" height="90" rx="12" fill="#f8fafc" stroke="#334155"/>
    <text x="350" y="338" text-anchor="middle" font-weight="700">GitHub repository</text>
    <text x="350" y="360" text-anchor="middle">main + feature branches</text>

    <rect x="520" y="300" width="200" height="90" rx="12" fill="#f8fafc" stroke="#334155"/>
    <text x="620" y="330" text-anchor="middle" font-weight="700">GitHub Actions CI</text>
    <text x="620" y="352" text-anchor="middle">npm ci → Jest tests</text>
    <text x="620" y="372" text-anchor="middle">npm audit → vite build</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="180" y1="345" x2="246" y2="345"/>
    <line x1="450" y1="345" x2="516" y2="345"/>
    <path d="M720 330 C 760 300, 640 250, 625 206" stroke-dasharray="6 4"/>
    <path d="M520 320 C 470 280, 380 250, 360 206" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="728" y="270">auto-deploy API</text>
    <text x="250" y="262">auto-deploy site</text>
  </g>
  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#64748b">The browser only ever talks to the Netlify domain, so the session cookie is first-party and SameSite=Strict works.</text>
</svg>
